[Service]
Environment="CUDA_DEVICE_ORDER=PCI_BUS_ID"
Environment="CUDA_VISIBLE_DEVICES=0"
Environment="OLLAMA_FLASH_ATTENTION=1"
Environment="OLLAMA_KV_CACHE_TYPE=q8_0"
Environment="OLLAMA_KEEP_ALIVE=-1"
Environment="OLLAMA_CONTEXT_LENGTH=16384"
# MI50 has a 16GB BAR over 32GB of VRAM: keep llama.cpp off CPU-visible VRAM so it can use all 32GB
Environment="GGML_VK_DISABLE_HOST_VISIBLE_VIDMEM=1"
Environment="RADV_PERFTEST=nogttspill"
Environment="OLLAMA_MAX_LOADED_MODELS=2"
Environment="OLLAMA_NUM_PARALLEL=2"
Environment="LLAMA_ARG_SWA_FULL=1"
Environment="LLAMA_ARG_CTX_CHECKPOINTS=0"
Environment="LLAMA_ARG_CACHE_RAM=0"
